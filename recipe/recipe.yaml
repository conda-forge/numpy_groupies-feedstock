schema_version: 1

context:
  version: "0.15.0"

package:
  name: numpy_groupies
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numpy_groupies/numpy_groupies-${{ version }}.tar.gz
  sha256: 1c188f4a03d2693d2e454fa46ff2c4a6ce385d2b89c98d024d910a3a72ed835b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - numpy_groupies
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Optimised tools for group-indexing operations: aggregated sum and more."
  license: BSD-2-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/numpy-groupies/

extra:
  recipe-maintainers:
    - dcherian
    - ml31415
    - ocefpaf
    - synapticarbors
